baseURL = 'https://leedark.github.io/'
languageCode = 'en-us'
title = "Lee's Personal & Blogging"
theme = 'basic'
enableRobotsTXT = true
googleAnalytics = "G-873H41K7BV"
pygmentsUseClasses = true

[params]
author = "Lee"
description = "My Portfolio Site"
gh_url = "https://api.github.com/users"
gh_user = "LeeDark"

[permalinks]
posts = "posts/:year/:month/:slug/"
year = "/posts/:slug/"
month = "/posts/:slug/"

[taxonomies]
year = "year"
month = "month"
tag = "tags"
category = "categories"

